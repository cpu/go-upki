name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: geomys/sandboxed-step@v1.2.1
        with:
          run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: geomys/sandboxed-step@v1.2.1
        with:
          run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check if modules are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum are not tidy. Please run 'go mod tidy' locally and commit changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Verify Go formatting
        # 'gofmt -l .' to list files whose formatting differs from gofmt's
        # 'test -z' to verify that the output is empty
        run: test -z "$(gofmt -l .)"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  fuzz:
    # Native Go fuzzing of the untrusted-input deserializers, time-boxed so
    # the job stays fast. Seed corpora also run as regular tests in the
    # `test` job; this job additionally explores new inputs. New failing
    # inputs are written to testdata/fuzz/ and uploaded as an artifact for
    # reproduction.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz clubcard filter deserialization
        run: go test -run='^FuzzFromBytes$' -fuzz='^FuzzFromBytes$' -fuzztime=60s ./crlite

      - name: Fuzz revocation index deserialization
        if: ${{ !cancelled() }}
        run: go test -run='^FuzzIndex$' -fuzz='^FuzzIndex$' -fuzztime=60s ./internal

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failing-inputs
          path: |
            crlite/testdata/fuzz
            internal/testdata/fuzz
          if-no-files-found: ignore

  integration:
    # Exercises the env-gated tests in upki/ against a real upki cache:
    # install a pinned upki-cli release, run `upki fetch` against the public
    # rustls mirror, and run the Go tests with UPKI_CACHE_DIR pointing at
    # the populated cache.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPKI_CLI_VERSION: v1.0.2
      UPKI_CLI_ARCHIVE: upki-cli-x86_64-unknown-linux-gnu.tar.xz
      UPKI_CLI_SHA256: 31c2874a098181558ee55f3d2956ab2e836ce7b4be2ed1196243d2eafad8833a
      UPKI_CACHE_DIR: ${{ github.workspace }}/_cache/upki
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install upki CLI
        run: |
          curl -sSfL --retry 3 -o "$UPKI_CLI_ARCHIVE" \
            "https://github.com/rustls/upki/releases/download/$UPKI_CLI_VERSION/$UPKI_CLI_ARCHIVE"
          echo "$UPKI_CLI_SHA256 *$UPKI_CLI_ARCHIVE" | sha256sum -c -
          mkdir -p _upki-cli
          tar -xJf "$UPKI_CLI_ARCHIVE" -C _upki-cli --strip-components=1
          _upki-cli/upki --version

      - name: Fetch upki revocation data
        run: |
          cat > upki-config.toml <<EOF
          cache-dir = "$UPKI_CACHE_DIR"
          [revocation]
          fetch-url = "https://upki.rustls.dev/revocation/"
          EOF
          _upki-cli/upki --config-file upki-config.toml fetch

      - name: Run Go tests against fetched cache
        run: go test -race ./...
